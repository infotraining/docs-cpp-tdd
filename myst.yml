version: 1
project:
  title: Test-Driven Development w C++
  authors:
    - name: Krystian Piękoś - Infotraining
  github: infotraining/docs-cpp-tdd
  thebe:
    binder:
      repo: infotraining/docs-cpp-tdd
      provider: github
      url: https://mybinder.org
      ref: master
  bibliography:
    - references.bib
  exports:
    - format: pdf
      template: plain_latex_book
      output: exports/cpp-tdd.pdf
  toc:
    - file: content/index.md
    - file: content/tdd.md
    - file: content/tdd-in-practice.md
    - file: content/unit-tests.md
    - file: content/unit-tests-frameworks.md
      children:
        - file: content/gtest.md
        - file: content/catch2.md
    - file: content/unit-test-patterns.md
    - file: content/refactoring.md
    - file: content/solid-oop.md
    - file: content/dependency-injection.md
    - file: content/test-doubles.md
      children:
        - file: content/test-doubles-intro.md
        - file: content/test-doubles-types.md
        - file: content/stub-vs-mock.md
        - file: content/gmock.md
site:
  template: book-theme
  options:
    style: ./css/custom.css
    logo: ./images/logo-infotraining-light.svg     # path to your logo, shown top left at site
    logo_dark: ./images/logo-infotraining-dark.svg # path to your logo for dark mode, shown top left at site
    favicon: ./images/favicon-infotraining.png     # path to your favicon, shown in browser tab
    folders: false
    hide_authors: true